name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t d4ybe:ci .
      - name: Smoke test /health
        run: |
          docker run -d --name api -p 8080:8080 d4ybe:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8080/health && exit 0
            sleep 1
          done
          docker logs api
          exit 1
